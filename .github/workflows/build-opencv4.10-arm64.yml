name: Build and Cache OpenCV 4.10.0 ARM with Contrib

on:
  workflow_dispatch:

jobs:
  cache-opencv:
    runs-on: ubuntu-24.04-arm

    container:
      image: ubuntu:22.04

    steps:
      - name: Restore OpenCV ARM64 Cache
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/opencv4-install
          key: global-linux-arm64-ubuntu22-opencv-4.10.0-contrib-ffmpeg-off-tiff-off-gstreamer-on-v2

      - name: Install System Dependencies
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev

      - name: Download OpenCV Sources
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.10.0 \
            https://github.com/opencv/opencv.git

          git clone --depth 1 --branch 4.10.0 \
            https://github.com/opencv/opencv_contrib.git

      - name: Build OpenCV for ARM64
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p opencv/build

          cmake -S opencv -B opencv/build \
            -D CMAKE_BUILD_TYPE=RELEASE \
            -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/opencv4-install" \
            -D OPENCV_EXTRA_MODULES_PATH="${{ github.workspace }}/opencv_contrib/modules" \
            -D WITH_FFMPEG=OFF \
            -D WITH_TIFF=OFF \
            -D WITH_GSTREAMER=ON \
            -D WITH_GTK=ON \
            -D WITH_GTK_2_X=OFF \
            -D WITH_CUDA=OFF \
            -D BUILD_EXAMPLES=OFF \
            -D BUILD_TESTS=OFF \
            -D BUILD_PERF_TESTS=OFF \
            -D BUILD_DOCS=OFF \
            -D BUILD_opencv_python3=OFF \
            -D BUILD_JAVA=OFF \
            -D OPENCV_ENABLE_NONFREE=OFF

          cmake --build opencv/build --parallel "$(nproc)"
          cmake --install opencv/build

      - name: Verify ARM64 Libraries
        run: |
          uname -m
          file opencv4-install/lib/libopencv_core.so*
          find opencv4-install -name OpenCVConfig.cmake
          find opencv4-install/lib -name "*.so*"
