name: Build and Cache OpenCV 4.10.0 with Contrib

on:
  workflow_dispatch:

jobs:
  cache-opencv:
    # Restrict to Linux since your specific dependencies rely on Ubuntu's package manager
    runs-on: ubuntu-latest

    steps:
    # 1. Initialize Cache
    - name: Cache OpenCV Binaries
      id: cache-opencv
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/opencv-install
        key: global-linux-opencv-4.10.0-contrib-custom

    # 2. Install your required system dependencies
    - name: Install System Dependencies
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      run: |
        sudo apt update
        sudo apt install -y \
          ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
          libswscale-dev libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgtk-3-dev libgtk2.0-dev

    # 3. Clone and compile from source using your precise CMake parameters
    - name: Build OpenCV from Source
      if: steps.cache-opencv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Clone both core and contrib modules targeting version 4.10.0
        git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv.git
        git clone --depth 1 --branch 4.10.0 https://github.com/opencv/opencv_contrib.git
        
        mkdir opencv/build
        cd opencv/build
        
        # Modified your snippet to install to the isolated workspace path for proper caching
        cmake \
          -D CMAKE_BUILD_TYPE=RELEASE \
          -D CMAKE_INSTALL_PREFIX="${{ github.workspace }}/opencv-install" \
          -D OPENCV_EXTRA_MODULES_PATH="${{ github.workspace }}/opencv_contrib/modules" \
          -D WITH_FFMPEG=ON \
          -D WITH_GSTREAMER=ON \
          -D WITH_GTK=ON \
          -D WITH_GTK_2_X=OFF \
          -D WITH_CUDA=OFF \
          -D BUILD_EXAMPLES=OFF \
          -D BUILD_TESTS=OFF \
          -D BUILD_PERF_TESTS=OFF \
          ..
          
        # Compile and install to your localized directory
        make -j$(nproc)
        make install
